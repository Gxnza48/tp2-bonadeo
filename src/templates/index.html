<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <title>Nafteando</title>
  <meta name="description" content="¿Vale la pena desviarme para cargar más barato? Ahorro neto real con precios oficiales.">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
  <header class="encabezado">
    <h1>Nafteando</h1>
    <p>¿Vale la pena desviarme para cargar más barato?</p>
  </header>

  <main>
    <form id="formulario" class="tarjeta" autocomplete="off">
      <div class="modos" role="radiogroup" aria-label="Modo">
        <label><input type="radio" name="modo" value="cerca" checked> Cerca mío</label>
        <label><input type="radio" name="modo" value="destino"> Tengo destino</label>
      </div>

      <label class="campo">
        <span>Desde</span>
        <div class="con-boton">
          <input id="desde" name="desde" placeholder="Oroño 1500 o tu ubicación" required>
          <button type="button" id="ubicacion" class="secundario" title="Usar mi ubicación">Mi ubicación</button>
        </div>
      </label>

      <label class="campo" id="campo-hasta" hidden>
        <span>Hasta</span>
        <input id="hasta" name="hasta" placeholder="Pellegrini 3000">
      </label>

      <label class="campo">
        <span>Combustible</span>
        <select id="producto" name="producto">
          {% for valor, etiqueta in productos.items() %}
          <option value="{{ valor }}">{{ etiqueta }}</option>
          {% endfor %}
        </select>
      </label>

      <div class="fila">
        <label class="campo">
          <span>Litros a cargar</span>
          <input id="litros" name="litros" type="number" inputmode="decimal" min="1" step="any" value="30">
        </label>
        <label class="campo">
          <span>Km por litro</span>
          <input id="consumo" name="consumo" type="number" inputmode="decimal" min="1" step="any" value="12">
        </label>
      </div>

      <details>
        <summary>Contar mi tiempo</summary>
        <label class="campo">
          <span>¿Cuánto vale tu hora? ($)</span>
          <input id="valor_hora" name="valor_hora" type="number" inputmode="decimal" min="0" step="any" placeholder="0">
        </label>
      </details>

      <button type="submit" id="buscar" class="principal">¿Dónde cargo?</button>
    </form>

    <section id="resultado" class="tarjeta" hidden aria-live="polite"></section>

    <div id="mapa" class="tarjeta mapa" aria-label="Mapa de estaciones"></div>
  </main>

  <footer class="pie">
    Precios: Secretaría de Energía, Resolución 314/2016 (CC-BY 4.0), informados por cada estación.
    Rutas: OSRM. Mapa: © colaboradores de OpenStreetMap. Ciudad: {{ ciudad }}.
    No incluye descuentos por app ni tarjeta.
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
